<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUD SHOP</title>
    <link rel="stylesheet" href="aud.css">
    <link rel="icon" type="image/png" href="cas.jpg">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="header">
        <h1 class="h1"><i>CASSIUS CLICKER: JAVASCRIPT EDITION</i></h1>
    </div>
    
    <div class="audUpgrades">
        <div id="aussieSpirit" class="upgrade">
                <img src="australia.svg" width="100px" height="100px">
                <p>Aussie Spirit</p>
                <p>Cost: 50 AUD</p>
                <button>Buy</button>
        </div>
        <div id="sausageSizzle" class="upgrade">
                 <img src="snag.webp" width="80px" height="80px">
                <p>Host a sausage sizzle</p>
                <p>Cost: 100 AUD</p>
                <button>Buy</button>
        </div>

        <div id="didgeridoo" class="upgrade">
            <img src="digeridooh.jpg" width="80px" height="80px">
            <p>Buy $ didgeridoo</p>
            <p>Cost: 200 AUD</p>
            <button>Buy</button>
        </div>

        <div id="bunnings" class="upgrade">
            <img src="bunnings_logo.jpg" width="80px" height="80px">
            <p>Buy bunnings</p>
            <p>Cost: 1,000 AUD</p>
            <button>Buy</button>
        </div>

        <div id="annexNZ" class="upgrade">
            <img src="nz.svg" width="100px" height="100px">
            <p>Annex NZ</p>
            <p>Cost: 10,000 AUD</p>
            <button>Buy</button>
        </div>

        <div id="rebootCard" class="upgrade">
            <img src="gettyimages-1129401.avif" width="100px" height="100px">
            <p>Irwin's Reboot Card</p>
            <p>Cost: <span id="special">1M</span> AUD</p>
            <button>Buy</button>
        </div>
        
    </div>

    <nav>
        <a href="index.html" id="backToMenu">Back to Menu</a>
    </nav>

</body>
</html>
