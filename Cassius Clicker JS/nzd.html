<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZD Shop</title>
    <link rel="stylesheet" href="nzd.css">
    <link rel="icon" type="image/png" href="cas.jpg">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="header">
        <h1 class="h1"><i>CASSIUS CLICKER: JAVASCRIPT EDITION</i></h1>
    </div>

    <div class="nzdUpgrades">
        <div id="raro" class="upgrade">
                <img src="raro.avif" width="100px" height="100px">
                <p>Build raro factories</p>
                <p>Cost: 500 NZD</p>
                <button>Buy</button>
        </div>
        <div id="peterjackson" class="upgrade">
                <img src="Peter_Jackson.webp" width="100px" height="100px">
                <p>Make a movie with Peter Jackson</p>
                <p>Cost: 1,500 NZD</p>
                <button>Buy</button>
        </div>
        <div id="chocolate" class="upgrade">
                <img src="Whittaker's_Chocolate_te_reo_label.jpg" width="100px" height="100px">
                <p>Buy Whittakers</p>
                <p>Cost: 4,444 NZD</p>
                <button>Buy</button>
        </div>
        <div id="timezone" class="upgrade">
                <img src="raro.avif" width="100px" height="100px">
                <p>Open a Timezone</p>
                <p>Cost: 7,500 NZD</p>
                <button>Buy</button>
        </div>
        <div class="upgrade" id="depricated" height="220">
                <img src="costume2.svg" width="100px" height="100px">
                <p>Currency Converter</p>
                <p>Cost: <s>15,000</s> NZD</p>
                <button>Buy</button>
        </div>
        <div class="upgrade" id="btcMiner" height="222">
                <img src="images.png" width="100px" height="100px">
                <p>Buy BTC Miner</p>
                <p>Cost: 30,000 NZD</p>
                <button>Buy</button>
        </div>
        
    </div>

    <nav><a href="index.html" id="backToMenu">Back to Menu</a></nav>
</body>
</html>
